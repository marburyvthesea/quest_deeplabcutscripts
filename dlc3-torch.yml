# Portable Quest environment for the headless DeepLabCut 3 pipeline.
# Keep Conda requirements minimal: full `conda env export` output pins compiler
# runtimes and system libraries that differ between Quest module installations.
name: dlc3-torch
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      - "deeplabcut[pytorch]==3.0.1"
      - torch==2.14.0
      - torchvision==0.29.0
      - numpy==1.26.4
      - pandas==2.3.3
      - scipy==1.15.3
      - scikit-image==0.25.2
      - scikit-learn==1.7.2
      - matplotlib==3.8.4
      - opencv-python-headless==4.11.0.86
      - pyarrow==25.0.1
      - tables==3.10.1
